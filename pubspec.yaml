name: prayer_times_app
description: "A Prayer Times Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network
  http: ^1.6.0

  # Location
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Date / Time
  intl: ^0.20.3

  # Local Storage
  shared_preferences: ^2.5.4

  # Notifications
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # Audio Player - Azan play/stop ke liye
  audioplayers: ^6.5.1

  # Qibla / Compass
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.0
  flutter_svg: ^2.3.0

  # Nearby Mosques Map Launcher
  url_launcher: ^6.3.1

  # In-app Google Maps WebView
  webview_flutter: ^4.10.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/audio/azan.mp3
    - assets/icon/app_icon.png
    - assets/images/